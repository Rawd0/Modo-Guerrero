manifestVersion: 1
id: modo-guerrero-app
name: Modo Guerrero
tagline: Tus carreras y tu salud de Garmin, en tu propio servidor
icon: https://raw.githubusercontent.com/Rawd0/Modo-Guerrero/main/docs/icon.svg
category: Health
version: "0.11.2"
port: 8095
description: >-
  Panel personal de carrera a pie con tus datos de Garmin Connect: carreras con mapa,
  gráficas y parciales, récords personales, forma y carga (CTL/ATL/TSB), VO2max, sueño,
  VFC, pulso en reposo, Body Battery y estrés.


  La página de inicio se personaliza con widgets. Los datos se guardan sólo en tu servidor.
developer: Rawd0
website: https://github.com/Rawd0/Modo-Guerrero
submitter: Rawd0
submission: https://github.com/Rawd0/Modo-Guerrero
repo: https://github.com/Rawd0/Modo-Guerrero
support: https://github.com/Rawd0/Modo-Guerrero/issues
gallery: []
releaseNotes: >-
  Carga más rápida y fiable (por VPN o con poca cobertura).

  - La app y sus librerías se envían comprimidas: se descargan unos 0,4 MB en lugar de ~1,4 MB.
  - Los archivos de la app se guardan en el móvil hasta la siguiente versión, así que al volver a abrirla apenas se descarga nada.
  - Si la base de datos está ocupada (sincronizando, haciendo una copia…), la app ya no se queda bloqueada al cargar.
  - Si algo falla al arrancar, se muestra el motivo con un botón para reintentar, en vez de una pantalla en blanco.
  - Nueva página de diagnóstico de la conexión: /diag (comprueba servidor, sesión y descargas, con informe para copiar).
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
