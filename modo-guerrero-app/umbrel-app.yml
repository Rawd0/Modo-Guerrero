manifestVersion: 1
id: modo-guerrero-app
name: Modo Guerrero
tagline: Tus carreras y tu salud de Garmin, en tu propio servidor
icon: https://raw.githubusercontent.com/Rawd0/Modo-Guerrero/main/docs/icon.svg
category: Health
version: "0.4.0"
port: 8095
description: >-
  Panel personal de carrera a pie con tus datos de Garmin Connect: carreras con mapa,
  gráficas y parciales, récords personales, forma y carga (CTL/ATL/TSB), VO2max, sueño,
  VFC, pulso en reposo, Body Battery y estrés.


  La página de inicio se personaliza con widgets. Los datos se guardan sólo en tu servidor.
developer: Rawd0
website: https://github.com/Rawd0/Modo-Guerrero
submitter: Rawd0
submission: https://github.com/Rawd0/Modo-Guerrero
repo: https://github.com/Rawd0/Modo-Guerrero
support: https://github.com/Rawd0/Modo-Guerrero/issues
gallery: []
releaseNotes: >-
  Varios usuarios en la misma app.

  - Nuevo panel «Usuarios» en Ajustes (sólo administradores): crear usuarios con contraseña temporal, restablecer contraseñas, dar o quitar permisos de administrador y eliminar usuarios.
  - Cada usuario tiene sus propios datos (carreras, salud, récords, forma), su propia cuenta de Garmin, sus objetivos, su inicio y su tema. Nadie ve los datos de otro, tampoco el administrador.
  - Al entrar por primera vez con una contraseña temporal, hay que elegir una propia.
  - La sincronización con Garmin atiende a los usuarios por turnos para no saturar a Garmin.
  - Al actualizar, todos tus datos y ajustes actuales pasan automáticamente a tu cuenta de administrador.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
