manifestVersion: 1
id: modo-guerrero-app
name: Modo Guerrero
tagline: Tus carreras y tu salud de Garmin, en tu propio servidor
icon: https://raw.githubusercontent.com/Rawd0/Modo-Guerrero/main/docs/icon.svg
category: Health
version: "0.1.0"
port: 8095
description: >-
  Panel personal de carrera a pie con tus datos de Garmin Connect: carreras con mapa,
  gráficas y parciales, récords personales, forma y carga (CTL/ATL/TSB), VO2max, sueño,
  VFC, pulso en reposo, Body Battery y estrés.


  La página de inicio se personaliza con widgets. Los datos se guardan sólo en tu servidor.
developer: Rawd0
website: https://github.com/Rawd0/Modo-Guerrero
submitter: Rawd0
submission: https://github.com/Rawd0/Modo-Guerrero
repo: https://github.com/Rawd0/Modo-Guerrero
support: https://github.com/Rawd0/Modo-Guerrero/issues
gallery: []
releaseNotes: >-
  Primera versión de Modo Guerrero.

  - Sincronización automática con Garmin Connect, con verificación en dos pasos.
  - Historial de carreras con mapa, gráficas de ritmo, FC y altitud, y parciales por kilómetro.
  - Récords personales (400 m a maratón) calculados dentro de cualquier carrera.
  - Forma y carga (CTL/ATL/TSB), VO2max y estado de entrenamiento de Garmin.
  - Salud diaria: sueño, VFC, FC en reposo, Body Battery, estrés y pasos.
  - Inicio personalizable con widgets.
  - Importación manual de archivos .FIT.
dependencies: []
path: ""
defaultUsername: ""
defaultPassword: ""
