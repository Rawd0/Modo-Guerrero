manifestVersion: 1
id: modo-guerrero-app
name: Modo Guerrero
tagline: Tus carreras y tu salud de Garmin, en tu propio servidor
icon: https://raw.githubusercontent.com/Rawd0/Modo-Guerrero/main/docs/icon.svg
category: Health
version: "0.8.2"
port: 8095
description: >-
  Panel personal de carrera a pie con tus datos de Garmin Connect: carreras con mapa,
  gráficas y parciales, récords personales, forma y carga (CTL/ATL/TSB), VO2max, sueño,
  VFC, pulso en reposo, Body Battery y estrés.


  La página de inicio se personaliza con widgets. Los datos se guardan sólo en tu servidor.
developer: Rawd0
website: https://github.com/Rawd0/Modo-Guerrero
submitter: Rawd0
submission: https://github.com/Rawd0/Modo-Guerrero
repo: https://github.com/Rawd0/Modo-Guerrero
support: https://github.com/Rawd0/Modo-Guerrero/issues
gallery: []
releaseNotes: >-
  Cabecera en iPhone y salud a 7 días.

  - App en la pantalla de inicio del iPhone: la cabecera baja lo suficiente para que el logo y el estado de sincronización queden fuera del difuminado que iOS pone bajo la barra de estado.
  - Salud: nueva escala de 7 días (y «6 meses» y «1 año» en lugar de 180 y 365 días). Con pocos días se marcan los puntos y el eje muestra el día de la semana.
