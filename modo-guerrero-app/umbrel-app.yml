manifestVersion: 1
id: modo-guerrero-app
name: Modo Guerrero
tagline: Tus carreras y tu salud de Garmin, en tu propio servidor
icon: https://raw.githubusercontent.com/Rawd0/Modo-Guerrero/main/docs/icon.svg
category: Health
version: "0.8.1"
port: 8095
description: >-
  Panel personal de carrera a pie con tus datos de Garmin Connect: carreras con mapa,
  gráficas y parciales, récords personales, forma y carga (CTL/ATL/TSB), VO2max, sueño,
  VFC, pulso en reposo, Body Battery y estrés.


  La página de inicio se personaliza con widgets. Los datos se guardan sólo en tu servidor.
developer: Rawd0
website: https://github.com/Rawd0/Modo-Guerrero
submitter: Rawd0
submission: https://github.com/Rawd0/Modo-Guerrero
repo: https://github.com/Rawd0/Modo-Guerrero
support: https://github.com/Rawd0/Modo-Guerrero/issues
gallery: []
releaseNotes: >-
  Ajustes en el iPhone y en la sincronización.

  - App en la pantalla de inicio del iPhone: más margen en la cabecera para que la fila de secciones no se vea cortada, y sin ampliación automática del texto.
  - Ajustes › Sincronización explica mejor el estado: cuántas actividades son de carrera y cuántas de otros deportes (se guardan pero no se analizan), de cuántas carreras se ha descargado el detalle, cuántas quedan y si está todo al día.
  - Si Garmin no devolvió el detalle de alguna carrera, se indica y puedes reintentarlo con un botón.
