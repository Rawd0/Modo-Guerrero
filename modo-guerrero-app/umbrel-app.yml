releaseNotes: >-
  Forma: escalas de 7 y 30 días.

  - La pestaña Forma tiene ahora 7 días, 30 días, 90 días, 6 meses, 1 año y 2 años.
  - Con pocos días cada día se marca con un punto, el eje muestra el día de la semana y desaparece la barra de zoom.
  - Los botones de escala ya no se parten en dos líneas en el móvil (si no caben, se desplazan de lado).
