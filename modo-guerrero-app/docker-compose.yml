version: "3.7"

services:
  app_proxy:
    environment:
      # formato: <id-de-la-app>_<servicio>_1
      APP_HOST: modo-guerrero-app_web_1
      APP_PORT: 8080

  web:
    # La acción de GitHub "release" actualiza esta línea en cada versión.
    image: ghcr.io/rawd0/modo-guerrero:0.1.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: Europe/Madrid
      DATA_DIR: /data
      GARMIN_PAUSE: "1.0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
