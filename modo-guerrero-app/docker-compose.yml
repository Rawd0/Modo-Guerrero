version: "3.7"

services:
  app_proxy:
    environment:
      # formato: <id-de-la-app>_<servicio>_1
      APP_HOST: modo-guerrero-app_web_1
      APP_PORT: 8080
      # La app tiene su propio inicio de sesión (usuarios y "recordar dispositivo"),
      # así que no se pide además la contraseña de Umbrel.
      PROXY_AUTH_ADD: "false"

  web:
    # La acción de GitHub "release" actualiza esta línea en cada versión.
    image: ghcr.io/rawd0/modo-guerrero:0.4.0@sha256:8ff34b64f7a8ba4058e97889d5bf12df587e3c4ddacf5093cf025a9a55464d12
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: Europe/Madrid
      DATA_DIR: /data
      GARMIN_PAUSE: "1.0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
