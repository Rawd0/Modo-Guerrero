version: "3.7"

services:
  app_proxy:
    environment:
      # formato: <id-de-la-app>_<servicio>_1
      APP_HOST: modo-guerrero-app_web_1
      APP_PORT: 8080
      # La app tiene su propio inicio de sesión (usuarios y "recordar dispositivo"),
      # así que no se pide además la contraseña de Umbrel.
      PROXY_AUTH_ADD: "false"

  web:
    # La acción de GitHub "release" actualiza esta línea en cada versión.
    image: ghcr.io/rawd0/modo-guerrero:0.2.0@sha256:d9b3fa88e7c5feb26792560eea1cd456290708b1076d2230b5bb5549e8c989ef
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: Europe/Madrid
      DATA_DIR: /data
      GARMIN_PAUSE: "1.0"
    volumes:
      - ${APP_DATA_DIR}/data:/data
