<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Modo Guerrero</title>
  <meta name="theme-color" content="#0f1216">
  <!-- app en la pantalla de inicio (iPhone / Android) -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Modo Guerrero">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="/static/icons/logo.svg">
  <link rel="alternate icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23ff6b2c'/><path d='M8 22l6-12 4 8 3-5 3 9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <script>
    // aplicar el tema guardado antes de pintar, para que no parpadee
    try {
      var t = JSON.parse(localStorage.getItem("mg_theme") || "{}");
      if (t.theme && t.theme !== "auto") document.documentElement.dataset.theme = t.theme;
      if (t.accent) document.documentElement.style.setProperty("--accent", t.accent);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/static/vendor/leaflet.css?v=__VERSION__">
  <link rel="stylesheet" href="/static/app.css?v=__VERSION__">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img class="logo" src="/static/icons/logo.svg?v=__VERSION__" alt="" width="32" height="32">
      <span class="wordmark"><span class="wm-top">MODO</span><span class="wm-main">GUERRERO</span></span><small id="version">v__VERSION__</small>
    </a>
    <nav id="nav">
      <a href="#/" data-route="home">Inicio</a>
      <a href="#/carreras" data-route="carreras">Carreras</a>
      <a href="#/salud" data-route="salud">Salud</a>
      <a href="#/forma" data-route="forma">Forma</a>
      <a href="#/objetivos" data-route="objetivos">Objetivos</a>
      <a href="#/records" data-route="records">Récords</a>
      <a href="#/stats" data-route="stats">Estadísticas</a>
      <a href="#/rutas" data-route="rutas">Rutas</a>
      <a href="#/zapatillas" data-route="zapatillas">Zapatillas</a>
      <a href="#/ajustes" data-route="ajustes">Ajustes</a>
    </nav>
    <button id="syncBtn" class="sync-pill" title="Sincronizar ahora">
      <span class="dot"></span><span id="syncText">…</span>
    </button>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
  <div id="toast" class="toast" hidden></div>

  <script>
    // si algo falla al arrancar, mostrarlo en vez de dejar la pantalla en blanco
    (function () {
      var shown = false;
      function show(msg) {
        if (shown || window.__mgStarted) return; shown = true;
        var v = document.getElementById("view");
        document.body.classList.remove("auth-screen");
        v.innerHTML = '<div class="boot-error"><h2>La app no ha terminado de cargar</h2><p>' + String(msg).replace(/[<>&]/g, "") +
          '</p><p><button onclick="location.reload()">Reintentar</button> <a href="/diag">Diagnóstico de la conexión</a></p></div>';
      }
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (t && (t.src || t.href)) show("No se pudo descargar " + (t.src || t.href).split("?")[0].replace(location.origin, ""));
        else show("Error: " + (e.message || e));
      }, true);
      window.addEventListener("unhandledrejection", function (e) { show("Error: " + ((e.reason && e.reason.message) || e.reason)); });
      setTimeout(function () { show("Tarda demasiado en responder (más de 20 s). Puede ser la conexión (VPN, cobertura) o que el servidor esté ocupado."); }, 20000);
    })();
  </script>
  <script src="/static/vendor/echarts.min.js?v=__VERSION__"></script>
  <script src="/static/vendor/leaflet.js?v=__VERSION__"></script>
  <script src="/static/vendor/Sortable.min.js?v=__VERSION__"></script>
  <script src="/static/app.js?v=__VERSION__"></script>
</body>
</html>
