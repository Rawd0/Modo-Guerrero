name: Comprobaciones

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/ci.yml"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Instalar dependencias
        run: pip install -r src/requirements.txt

      - name: Compilar Python
        run: python -m compileall -q src/app src/scripts

      - name: Comprobar JavaScript
        run: node --check src/app/static/app.js

      - name: Arrancar la app con datos de prueba
        working-directory: src
        env:
          DATA_DIR: /tmp/guerrero-data
          APP_VERSION: ci
        run: |
          python -m scripts.demo_data
          uvicorn app.main:app --port 8080 &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          H="X-Requested-With: modo-guerrero"
          # sin sesión, la API debe estar cerrada
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/home)" = "401" || { echo "La API no exige sesión"; exit 1; }
          # crear la cuenta inicial y usar su cookie
          curl -fs -c jar -H "$H" -H "Content-Type: application/json" \
            -d '{"username":"ci-test","password":"contrasena-de-prueba","remember":true}' localhost:8080/api/auth/setup
          for p in status home activities records "stats?group=week" health fitness settings account/sessions pace-curve "progression?metric=elev" shoes; do
            curl -fs -b jar -o /dev/null "localhost:8080/api/$p" || { echo "Falla /api/$p"; exit 1; }
          done
          id=$(curl -fs -b jar localhost:8080/api/activities | python -c "import sys,json;print(json.load(sys.stdin)['items'][0]['id'])")
          curl -fs -b jar -o /dev/null "localhost:8080/api/activities/$id"
          # zapatillas: alta, asignación a carreras y km acumulados
          curl -fs -b jar -H "$H" -H "Content-Type: application/json" \
            -d '{"name":"CI","start_date":"2000-01-01","is_default":true,"assign_existing":true}' localhost:8080/api/shoes
          test "$(curl -fs -b jar localhost:8080/api/shoes | python -c "import sys,json;print(json.load(sys.stdin)[0]['runs']>0)")" = "True" || { echo "Zapatillas sin carreras"; exit 1; }
          # un segundo usuario no ve los datos del primero
          curl -fs -b jar -H "$H" -H "Content-Type: application/json" \
            -d '{"username":"ci-otro","password":"temporal-de-prueba"}' localhost:8080/api/admin/users
          curl -fs -c jar2 -H "$H" -H "Content-Type: application/json" \
            -d '{"username":"ci-otro","password":"temporal-de-prueba"}' localhost:8080/api/auth/login
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/home)" = "403" || { echo "No exige cambiar la contraseña temporal"; exit 1; }
          curl -fs -b jar2 -H "$H" -H "Content-Type: application/json" \
            -d '{"current":"temporal-de-prueba","new":"la-de-ci-otro-propia"}' localhost:8080/api/account/password
          test "$(curl -fs -b jar2 localhost:8080/api/activities | python -c "import sys,json;print(json.load(sys.stdin)['total'])")" = "0" || { echo "El segundo usuario ve datos ajenos"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/activities/$id)" = "404" || { echo "El segundo usuario abre una carrera ajena"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/admin/users)" = "403" || { echo "Un usuario normal entra en la administración"; exit 1; }
          test "$(curl -fs -b jar2 localhost:8080/api/shoes)" = "[]" || { echo "El segundo usuario ve zapatillas ajenas"; exit 1; }
          # sin la cabecera anti-CSRF, las escrituras se rechazan
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/sync)" = "403" || { echo "Falta protección CSRF"; exit 1; }
          curl -fs localhost:8080/ | grep -q "vci" || { echo "La versión no aparece en la página"; exit 1; }
          echo "Todo correcto"

      - name: Construir la imagen Docker
        run: docker build --build-arg APP_VERSION=ci -t modo-guerrero:ci src
