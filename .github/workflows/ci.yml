name: Comprobaciones

on:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/ci.yml"]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Instalar dependencias
        run: pip install -r src/requirements.txt

      - name: Compilar Python
        run: python -m compileall -q src/app src/scripts

      - name: Comprobar JavaScript
        run: node --check src/app/static/app.js

      - name: Arrancar la app con datos de prueba
        working-directory: src
        env:
          DATA_DIR: /tmp/guerrero-data
          APP_VERSION: ci
        run: |
          python -m scripts.demo_data
          uvicorn app.main:app --port 8080 &
          for i in $(seq 1 20); do curl -fs localhost:8080/healthz && break; sleep 1; done
          H="X-Requested-With: modo-guerrero"
          # sin sesión, la API debe estar cerrada
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/home)" = "401" || { echo "La API no exige sesión"; exit 1; }
          # crear la cuenta inicial y usar su cookie
          curl -fs -c jar -H "$H" -H "Content-Type: application/json" \
            -d '{"username":"ci-test","password":"contrasena-de-prueba","remember":true}' localhost:8080/api/auth/setup
          for p in status home activities records "stats?group=week" health fitness settings account/sessions pace-curve "progression?metric=elev" shoes; do
            curl -fs -b jar -o /dev/null "localhost:8080/api/$p" || { echo "Falla /api/$p"; exit 1; }
          done
          id=$(curl -fs -b jar localhost:8080/api/activities | python -c "import sys,json;print(json.load(sys.stdin)['items'][0]['id'])")
          curl -fs -b jar -o /dev/null "localhost:8080/api/activities/$id"
          # zapatillas: alta, asignación a carreras y km acumulados
          curl -fs -b jar -H "$H" -H "Content-Type: application/json" \
            -d '{"name":"CI","start_date":"2000-01-01","is_default":true,"assign_existing":true}' localhost:8080/api/shoes
          test "$(curl -fs -b jar localhost:8080/api/shoes | python -c "import sys,json;print(json.load(sys.stdin)[0]['runs']>0)")" = "True" || { echo "Zapatillas sin carreras"; exit 1; }
          # objetivo de carrera: crear y ver su predicción y preparación
          rid=$(curl -fs -b jar -H "$H" -H "Content-Type: application/json" \
            -d "{\"name\":\"CI\",\"date\":\"$(date -d '+30 days' +%F)\",\"distance_m\":21097.5,\"goal_time_s\":6300}" \
            localhost:8080/api/races | python -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -fs -b jar "localhost:8080/api/races/$rid" | python -c "import sys,json;d=json.load(sys.stdin);assert d['prediction']['estimate'] and d['projection'] and d['checklist'], d"
          # plan de entrenamiento: generar semanas y sesiones, terminar en la carrera y marcar una sesión
          sid=$(curl -fs -b jar -H "$H" -H "Content-Type: application/json" -d '{"days_per_week":4,"long_day":6}' \
            "localhost:8080/api/races/$rid/plan" | python -c "
          import sys,json;d=json.load(sys.stdin);w=d['weeks'];s=[x for k in w for x in k['sessions']]
          assert d['plan']['paces']['threshold'] and len(w)>=4 and s[-1]['type']=='race', d
          print(next(x['id'] for x in s if x['type']!='race'))")
          curl -fs -b jar -X PUT -H "$H" -H "Content-Type: application/json" -d '{"status":"skipped"}' "localhost:8080/api/plan-sessions/$sid"
          curl -fs -b jar localhost:8080/api/home | python -c "import sys,json;d=json.load(sys.stdin);assert d['today_session'] and 'sleep_perf' in d"
          # comparar periodos, calendario y anchura de widgets
          curl -fs -b jar "localhost:8080/api/compare?a_from=$(date -d '-27 days' +%F)&a_to=$(date +%F)&b_from=$(date -d '-55 days' +%F)&b_to=$(date -d '-28 days' +%F)" \
            | python -c "import sys,json;d=json.load(sys.stdin);assert d['a']['runs']>0 and len(d['a']['cum_km'])==28, d['a']"
          curl -fs -b jar localhost:8080/api/calendar | python -c "import sys,json;assert json.load(sys.stdin)['days']"
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X PUT -H "$H" -H "Content-Type: application/json" -d '{"widgets":[{"id":1}]}' localhost:8080/api/settings)" = "400" || { echo "Acepta widgets no válidos"; exit 1; }
          # rutas repetidas (los datos de ejemplo repiten recorridos) y Strava sin secretos a la vista
          rtid=$(curl -fs -b jar localhost:8080/api/routes | python -c "import sys,json;d=json.load(sys.stdin);assert d and d[0]['count']>=2, d;print(d[0]['id'])")
          curl -fs -b jar "localhost:8080/api/routes/$rtid" | python -c "import sys,json;d=json.load(sys.stdin);assert d['runs'] and d['track']"
          curl -fs -b jar -X PUT -H "$H" -H "Content-Type: application/json" -d '{"client_id":"123","client_secret":"strava-ci"}' localhost:8080/api/strava | grep -qv "strava-ci" || { echo "Se devuelve el secreto de Strava"; exit 1; }
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST -H "$H" -H "Content-Type: application/json" -d '{"origin":"javascript:x"}' localhost:8080/api/strava/connect)" = "400" || { echo "Acepta un origen no válido"; exit 1; }
          # HTTPS, Face ID y notificaciones
          curl -fs localhost:8080/sw.js | grep -q "notificationclick" || { echo "Falta el service worker"; exit 1; }
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST -H "$H" -H "Origin: http://localhost:8080" localhost:8080/api/auth/passkey/options)" = "400" || { echo "Face ID sin HTTPS no da error"; exit 1; }
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST -H "$H" -H "Content-Type: application/json" -d '{"origin":"https://192.168.1.10"}' localhost:8080/api/admin/https)" = "400" || { echo "Acepta una IP para Face ID"; exit 1; }
          curl -fs -b jar -X POST -H "$H" -H "Content-Type: application/json" -d '{"origin":"https://umbrel.ejemplo.ts.net"}' localhost:8080/api/admin/https | grep -q "ts.net"
          curl -fs -X POST -H "$H" -H "Origin: https://umbrel.ejemplo.ts.net" localhost:8080/api/auth/passkey/options | python -c "import sys,json;d=json.load(sys.stdin);assert d['options']['rpId']=='umbrel.ejemplo.ts.net' and d['flow'], d"
          curl -fs -b jar localhost:8080/api/push | python -c "import sys,json;d=json.load(sys.stdin);assert len(d['public_key'])>80 and d['prefs']['time'], d"
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST -H "$H" -H "Content-Type: application/json" -d '{"subscription":{"endpoint":"http://x"}}' localhost:8080/api/push/subscribe)" = "400" || { echo "Acepta una suscripción no válida"; exit 1; }
          # copia fuera del servidor: ajustes sin secretos a la vista
          curl -fs -b jar -X PUT -H "$H" -H "Content-Type: application/json" \
            -d '{"provider":"webdav","webdav":{"url":"http://127.0.0.1:9/dav/","user":"u","folder":"MG","password":"secreto-ci"}}' localhost:8080/api/admin/remote | grep -qv "secreto-ci" || { echo "Se devuelve la contraseña"; exit 1; }
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST -H "$H" localhost:8080/api/admin/remote/test)" = "400" || { echo "Probar un destino inaccesible no da error"; exit 1; }
          # copia de seguridad: crear, descargar (debe ser una base SQLite) y comprobar que se lista
          name=$(curl -fs -b jar -X POST -H "$H" localhost:8080/api/admin/backups | python -c "import sys,json;print(json.load(sys.stdin)['name'])")
          curl -fs -b jar "localhost:8080/api/admin/backups/$name" | gunzip | head -c 15 | grep -q "SQLite format 3" || { echo "La copia no es válida"; exit 1; }
          # un segundo usuario no ve los datos del primero
          curl -fs -b jar -H "$H" -H "Content-Type: application/json" \
            -d '{"username":"ci-otro","password":"temporal-de-prueba"}' localhost:8080/api/admin/users
          curl -fs -c jar2 -H "$H" -H "Content-Type: application/json" \
            -d '{"username":"ci-otro","password":"temporal-de-prueba"}' localhost:8080/api/auth/login
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/home)" = "403" || { echo "No exige cambiar la contraseña temporal"; exit 1; }
          curl -fs -b jar2 -H "$H" -H "Content-Type: application/json" \
            -d '{"current":"temporal-de-prueba","new":"la-de-ci-otro-propia"}' localhost:8080/api/account/password
          test "$(curl -fs -b jar2 localhost:8080/api/activities | python -c "import sys,json;print(json.load(sys.stdin)['total'])")" = "0" || { echo "El segundo usuario ve datos ajenos"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/activities/$id)" = "404" || { echo "El segundo usuario abre una carrera ajena"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/admin/users)" = "403" || { echo "Un usuario normal entra en la administración"; exit 1; }
          test "$(curl -fs -b jar2 localhost:8080/api/shoes)" = "[]" || { echo "El segundo usuario ve zapatillas ajenas"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/races/$rid)" = "400" || { echo "El segundo usuario ve carreras ajenas"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/races/$rid/plan)" = "400" || { echo "El segundo usuario ve planes ajenos"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' -X PUT -H "$H" -H "Content-Type: application/json" -d '{"status":"done"}' localhost:8080/api/plan-sessions/$sid)" = "400" || { echo "El segundo usuario cambia sesiones ajenas"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/admin/backups/$name)" = "403" || { echo "Un usuario normal descarga copias"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/admin/remote)" = "403" || { echo "Un usuario normal ve la copia remota"; exit 1; }
          test "$(curl -fs -b jar2 localhost:8080/api/routes)" = "[]" || { echo "El segundo usuario ve rutas ajenas"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' -X POST -H "$H" -H "Content-Type: application/json" -d '{"origin":"https://otro.ts.net"}' localhost:8080/api/admin/https)" = "403" || { echo "Un usuario normal autoriza direcciones"; exit 1; }
          test "$(curl -s -b jar2 -o /dev/null -w '%{http_code}' localhost:8080/api/routes/$rtid)" = "404" || { echo "El segundo usuario abre una ruta ajena"; exit 1; }
          curl -fs -b jar2 localhost:8080/api/strava | python -c "import sys,json;d=json.load(sys.stdin);assert not d['client_id'] and not d['connected'], d"
          # sin la cabecera anti-CSRF, las escrituras se rechazan
          test "$(curl -s -b jar -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/sync)" = "403" || { echo "Falta protección CSRF"; exit 1; }
          curl -fs localhost:8080/ | grep -q "vci" || { echo "La versión no aparece en la página"; exit 1; }
          echo "Todo correcto"

      - name: Construir la imagen Docker
        run: docker build --build-arg APP_VERSION=ci -t modo-guerrero:ci src
