name: Publicar versión

# Dos formas de publicar:
#  1. Cambiar el número del archivo VERSION (y las notas en RELEASE_NOTES.md) y subirlo a main.
#     La acción crea la etiqueta vX.Y.Z y el Release de GitHub automáticamente.
#  2. Crear un Release desde GitHub ("Releases → Draft a new release") con una etiqueta vX.Y.Z.
on:
  push:
    branches: [main]
    paths: ["VERSION"]
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Datos de la versión
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # Notas: el texto del Release de GitHub, o si no el mensaje de la etiqueta
            sleep 5
            gh release view "$GITHUB_REF_NAME" --json body -q .body > notes.txt 2>/dev/null || true
            if [ ! -s notes.txt ]; then git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt; fi
            echo "create_release=false" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(tr -d ' \n\r' < VERSION)"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "VERSION no tiene formato X.Y.Z: '$VERSION'"; exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
              echo "La versión v$VERSION ya existe; sube el número en VERSION."; exit 1
            fi
            cp RELEASE_NOTES.md notes.txt 2>/dev/null || echo "Versión $VERSION." > notes.txt
            echo "create_release=true" >> "$GITHUB_OUTPUT"
          fi
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$OWNER/modo-guerrero" >> "$GITHUB_OUTPUT"
          echo "Versión $VERSION"; cat notes.txt

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen (amd64 + arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: src
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.title=Modo Guerrero
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Crear la etiqueta y el Release de GitHub
        if: steps.v.outputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --target "$GITHUB_SHA" \
            --title "Modo Guerrero ${{ steps.v.outputs.version }}" --notes-file notes.txt

      - name: Actualizar la ficha de Umbrel
        run: |
          git checkout main
          git pull --ff-only origin main
          python scripts/update_umbrel_app.py "${{ steps.v.outputs.version }}" \
            "${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}@${{ steps.build.outputs.digest }}" notes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modo-guerrero-app
          git commit -m "Umbrel: versión ${{ steps.v.outputs.version }}" || echo "Sin cambios"
          git push origin main
